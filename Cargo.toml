[workspace]
members = ["crates/xapi", "crates/xapi-derive", "crates/xapi-http"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Clickin/xapi-rs"
readme = "README.md"
version = "0.3.1"

[workspace.dependencies]
xapi = { package = "xplatform-dataset", path = "crates/xapi", version = "0.3.1" }
xapi-derive = { path = "crates/xapi-derive", version = "0.3.1" }
xapi-http = { path = "crates/xapi-http", version = "0.3.1" }
http = "1"
