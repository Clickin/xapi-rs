name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify workspace
        run: |
          cargo fmt --all -- --check
          cargo test-serial
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo package --workspace --locked --allow-dirty --no-verify

      - name: Publish xapi-derive
        run: |
          if curl --fail --silent --show-error \
            https://crates.io/api/v1/crates/xapi-derive/0.2.0 >/dev/null; then
            echo "xapi-derive@0.2.0 is already published"
          else
            cargo publish -p xapi-derive --locked --token "$CARGO_REGISTRY_TOKEN"
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for xapi-derive index propagation
        run: sleep 30

      - name: Publish xplatform-dataset
        run: cargo publish -p xplatform-dataset --locked --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for xapi index propagation
        run: sleep 30

      - name: Publish xapi-http
        run: cargo publish -p xapi-http --locked --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" --generate-notes --verify-tag
